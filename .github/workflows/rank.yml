name: rankings
on:
  schedule:
    - cron: "17 1 * * *"     # Chess.com, daily
    - cron: "41 3 3 * *"     # FIDE, monthly (the list comes out on the 1st)
  workflow_dispatch:
    inputs:
      what: { description: "cc | fide | both", default: "both" }
      budget: { description: "Chess.com seconds", default: "18000" }
permissions:
  contents: write
concurrency: { group: rankings, cancel-in-progress: false }
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: { path: rank_cache.json.gz, key: "rank-${{ github.run_id }}", restore-keys: "rank-" }
      - name: FIDE
        if: github.event.schedule == '41 3 3 * *' || inputs.what == 'fide' || inputs.what == 'both'
        continue-on-error: true
        run: |
          curl -fL --retry 5 --retry-delay 20 --max-time 900 -A "Mozilla/5.0 (ZIGRAX rankings)" -o players_list.zip https://ratings.fide.com/download/players_list.zip
          ls -la players_list.zip
          python3 scripts/rank.py fide players_list.zip
      - name: Chess.com
        if: github.event.schedule == '17 1 * * *' || inputs.what == 'cc' || inputs.what == 'both'
        run: python3 scripts/rank.py cc ${{ inputs.budget || '17000' }}
      - uses: actions/cache/save@v4
        if: always()
        with: { path: rank_cache.json.gz, key: "rank-${{ github.run_id }}" }
      - name: Publish
        run: |
          git config user.name "zigrax-bot"; git config user.email "bot@zigrax.com"
          git add rank
          git diff --cached --quiet || (git commit -qm "rankings $(date +%F)" && git pull -q --rebase && git push -q)
