# Builds the native Stockfish engine (the same "lite" network as the app's WebAssembly engine) for Android phones.
# The binaries go into the ZIGRAX Android app (app/src/main/jniLibs). Stockfish is GPL v3.
name: Stockfish for Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Source (stockfish.js 19.0.1 = Stockfish 19 with the lite network)
        run: git clone -q --depth 1 --branch v19.0.1 https://github.com/nmrugg/stockfish.js.git sf
      - name: Build
        run: |
          set -e
          sed -i 's/    uci\.loop();/    uci->loop();/' sf/src/main.cpp   # the native path of stockfish.js has a typo
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "NDK $ANDROID_NDK_LATEST_HOME"; aarch64-linux-android29-clang++ --version | head -1
          mkdir -p out/arm64-v8a out/armeabi-v7a out/test
          cd sf/src
          b() { make -s clean >/dev/null 2>&1 || true; make -j4 build ARCH=$1 COMP=$2 $3 LITE_NET=yes EXTRALDFLAGS="-Wl,-z,max-page-size=16384" > /tmp/log_$1.txt 2>&1 || { tail -60 /tmp/log_$1.txt; exit 1; }; [ "$2" = ndk ] && llvm-strip stockfish; ls -la stockfish; file stockfish; }
          b armv8-dotprod ndk COMPCXX=aarch64-linux-android26-clang++ && cp stockfish ../../out/arm64-v8a/libzxsf_dp.so
          b armv8 ndk COMPCXX=aarch64-linux-android26-clang++ && cp stockfish ../../out/arm64-v8a/libzxsf.so
          b armv7-neon ndk COMPCXX=armv7a-linux-androideabi26-clang++ && cp stockfish ../../out/armeabi-v7a/libzxsf.so
          b x86-64-avx2 clang && cp stockfish ../../out/test/stockfish-x86
          ls -la nn-*.nnue
      - name: Check (desktop copy of the same engine)
        run: |
          cd out/test; file stockfish-x86
          for t in 1 3; do
            for f in "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3" "r2q1rk1/ppp2ppp/2np1n2/2b1p1B1/2B1P1b1/2NP1N2/PPP2PPP/R2Q1RK1 w - - 4 8" "8/5pk1/6p1/3P4/2P2K2/8/8/8 w - - 0 50"; do
              { printf "uci\nsetoption name Threads value $t\nsetoption name Hash value 64\nisready\nposition fen $f\ngo nodes 300000\n"; sleep 6; } | timeout 12 ./stockfish-x86 | grep -B1 -m1 bestmove | tr '\n' ' ' | grep -oE "depth [0-9]+|nodes [0-9]+|time [0-9]+|bestmove [a-h1-8]+" | tr '\n' ' '; echo " (threads $t)"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zxsf-android
          path: out/
      - name: Keep the binaries on the branch sf-android-bin
        run: |
          cd out && rm -rf test && cp ../sf/Copying.txt COPYING.txt 2>/dev/null || true
          git init -q && git checkout -q -b sf-android-bin
          git config user.name zigrax-ci && git config user.email zigrax-ci@users.noreply.github.com
          git add -A && git commit -qm "native Stockfish 19 lite for Android (from nmrugg/stockfish.js v19.0.1, GPL v3)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sf-android-bin
